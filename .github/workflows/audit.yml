name: Audit

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Critical: Disables shallow clone for better analysis

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Optional: Cache dependencies to make this run faster next time
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Step A: Check Formatting (Fails if code is messy)
      - name: Check Formatting
        run: cargo fmt -- --check

      # Step B: Run Clippy (Fails if code has warnings)
      - name: Check Lints (Clippy)
        run: cargo clippy --all-features -- -D warnings

      # Step C: Install Tarpaulin
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Tests & Generate Coverage
        run: |
          cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out Lcov

      # Step 2: Run SonarCloud Scanner
      # This action automatically downloads and runs the scanner for you
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Built-in, no setup needed
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    